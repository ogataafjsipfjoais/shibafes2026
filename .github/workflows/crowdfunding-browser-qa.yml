name: Crowdfunding Browser QA
on:
  push:
    branches: [main]
    paths:
      - 'crowdfunding/index.html'
      - 'assets/crowdfunding/**'
      - 'tools/qa-crowdfunding-browser.py'
      - '.github/workflows/crowdfunding-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Chromium test runner
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install chromium
      - name: Verify real desktop and mobile layouts
        run: python3 tools/qa-crowdfunding-browser.py
      - name: Upload screenshot and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crowdfunding-browser-qa
          path: qa-artifacts/
          if-no-files-found: ignore
