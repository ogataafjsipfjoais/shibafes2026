name: Crowdfunding Browser QA
on:
  push:
    branches: [main, 'design/flight-story-v7']
    paths:
      - 'crowdfunding/index.html'
      - 'assets/crowdfunding/**'
      - 'tools/qa-crowdfunding-v8.py'
      - 'tools/qa-crowdfunding-webkit.py'
      - '.github/workflows/crowdfunding-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit-ipad:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install WebKit runtime and Safari-like test tools
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps webkit
      - name: Validate real S-320 flight on iPad-like WebKit without bypassing CSP
        run: python3 tools/qa-crowdfunding-webkit.py
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Chromium test runner
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install chromium
      - name: Install Japanese fonts for meaningful visual screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -f
      - name: Validate interactive story and assets
        run: node tools/test-crowdfunding-v8.mjs
      - name: Verify real desktop and mobile layouts
        run: python3 tools/qa-crowdfunding-v8.py
      - name: Upload screenshot and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clarity-v8-browser-qa
          path: qa-artifacts/
          if-no-files-found: ignore
